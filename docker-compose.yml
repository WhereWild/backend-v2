services:
  # No separate "tileserver" service here — tileserver-gl is installed
  # directly into this image (see Dockerfile) and runs in-process inside
  # whichever container needs it: automatically in the `api` service (MODE=
  # api, see docker/entrypoint.sh's _start_tileserver), or manually inside
  # this `gdal` container's shell (`tileserver-gl --config
  # docker/tileserver/config.json --port 8791 &`, after `Xvfb :99 &
  # export DISPLAY=:99` — see entrypoint.sh's _start_tileserver for the
  # exact invocation) for local testing.
  gdal:
    build: .
    network_mode: host
    volumes:
      - .:/workspace
      - root-home:/root
      - ${HOME}/.ssh:/root/.ssh:ro
      - ${HOME}/.ssh:/home/ubuntu/.ssh:ro
    environment:
      - RCLONE_CONFIG=/workspace/docker/rclone.conf
    devices:
      - /dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    stdin_open: true
    tty: true

volumes:
  root-home:
